name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  bridge-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test -count=1 -timeout 120s ./...
  smoke-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck smoke script syntax
        run: bash -n scripts/smoke_test.sh
