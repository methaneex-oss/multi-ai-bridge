# Multi-AI Bridge UI — Netlify
# Base directory = web (set here and in Netlify UI if needed)

[build]
  base = "web"
  command = "npm install && npm run build"
  # publish is managed by @netlify/plugin-nextjs — do not set .next manually

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Required env (set in Netlify dashboard):
#   BRIDGE_URL=https://multi-ai-bridge.onrender.com
#   NEXT_PUBLIC_WS_URL=wss://multi-ai-bridge.onrender.com/ws
