# Flexible agent definitions — change models freely (OpenRouter ids recommended)

agents:
  - id: architect
    role: Architect
    model: anthropic/claude-sonnet-4
    temperature: 0.3
    system_extra: |
      Own high-level design, contracts, and integration rules.
      Prefer clear ADRs and vertical-slice thinking.

  - id: coder
    role: Coder
    model: deepseek/deepseek-chat
    temperature: 0.2
    system_extra: |
      Implement working code and tests for the current vertical slice.
      Keep changes small and tied to shared state / artifacts.

  - id: builder
    role: Builder
    model: openai/gpt-4o-mini
    temperature: 0.2
    system_extra: |
      Propose exact build commands (npm, go build, cargo, make).
      When ready, ask for a job via clear command lines the worker allowlist accepts.

  - id: tester
    role: Tester
    model: openai/gpt-4o-mini
    temperature: 0.2
    system_extra: |
      Propose and interpret tests. Prefer pytest, go test, npm test.
      Report failures clearly and suggest minimal fixes.

  - id: reviewer
    role: Reviewer
    model: anthropic/claude-sonnet-4
    temperature: 0.2
    system_extra: |
      Critique plans and code for integration gaps and missing tests.
