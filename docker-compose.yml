services:
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: multi-ai-bridge-core
    ports:
      - "8080:8080"
    volumes:
      - bridge-data:/data
    environment:
      - BRIDGE_PORT=8080
      - DATABASE_PATH=/data/bridge.db
      - BRIDGE_API_KEY=${BRIDGE_API_KEY:-}
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: multi-ai-bridge-ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BRIDGE_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
    depends_on:
      - bridge
    restart: unless-stopped

  # Optional: uncomment to run agent cycles inside Docker
  # runners:
  #   build:
  #     context: .
  #     dockerfile: runners/Dockerfile
  #   environment:
  #     - BRIDGE_URL=http://bridge:8080
  #     - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
  #     - BRIDGE_API_KEY=${BRIDGE_API_KEY:-}
  #   depends_on:
  #     - bridge
  #   restart: unless-stopped

volumes:
  bridge-data:
